name: Cinnamon Spices PR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to publish (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  open-spices-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve and validate tag
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            TAG="$REF_NAME"
          else
            TAG="$INPUT_TAG"
          fi

          if [[ "$TAG" != v* ]]; then
            TAG="v${TAG}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag must follow vX.Y.Z format. Got: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.version.outputs.tag }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext zip

      - name: Create/Update Spices PR
        env:
          GH_TOKEN: ${{ secrets.SPICES_GH_TOKEN }}
          SPICES_FORK_REPO: andreas-glaser/cinnamon-spices-applets
          SPICES_UPSTREAM_REPO: linuxmint/cinnamon-spices-applets
          SPICES_BASE_BRANCH: master
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "Missing required secret: SPICES_GH_TOKEN" >&2
            exit 2
          fi
          tools/spices/publish-tag.sh --tag "${RELEASE_TAG}"
