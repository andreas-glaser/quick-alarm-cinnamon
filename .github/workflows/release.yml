name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  validate-version:
    name: Validate version format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            TAG="$REF_NAME"
          else
            TAG="$INPUT_TAG"
          fi

          if [[ "$TAG" != v* ]]; then
            TAG="v${TAG}"
          fi

          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must follow SemVer format (x.y.z). Got: $VERSION" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing: $TAG"

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: validate-version
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.validate-version.outputs.tag }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext gjs zip

      - name: Validate changelog entry exists
        shell: bash
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          if ! grep -Eq "^## ${VERSION} " CHANGELOG.md; then
            echo "Error: No changelog entry found for ${VERSION} in CHANGELOG.md" >&2
            echo "Expected a heading like: \"## ${VERSION} - YYYY-MM-DD\"" >&2
            exit 1
          fi

      - name: Build and package
        run: |
          tools/build.sh
          tools/release.sh
          ls -la dist

      - name: Generate release notes
        shell: bash
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            $0 ~ /^## / {
              if (found) exit
              if ($0 ~ "^## " version " ") { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "Error: Failed to extract changelog notes for ${VERSION}" >&2
            exit 1
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.validate-version.outputs.tag }}
          name: Release ${{ needs.validate-version.outputs.tag }}
          body_path: release-notes.md
          files: |
            dist/*.zip
          draft: false
          prerelease: false
